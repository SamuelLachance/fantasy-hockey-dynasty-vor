name: Build & deploy

on:
  push:
    branches: [main]
  schedule:
    # 6h30 and 12h30 (Eastern): fresh stats before morning and afternoon lineup locks
    - cron: "30 10 * * *"
    - cron: "30 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build data (NHL API + base projections)
        run: python scripts/build_data.py
      - name: Sanity check
        run: |
          python - <<'PY'
          import json
          d = json.load(open("site/data.json"))
          assert len(d["players"]) > 800, len(d["players"])
          print(len(d["players"]), "players,", len(d["schedule"]), "schedule days", d["rates"])
          PY
      # Publish site/ to the gh-pages branch (Pages serves that branch).
      - name: Publish to gh-pages
        run: |
          cd site
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Site build $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
